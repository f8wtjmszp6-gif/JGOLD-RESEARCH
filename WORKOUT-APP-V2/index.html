<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Workout V2" />
    <meta name="theme-color" content="#fafaf9" />

    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <title>Workout V2</title>
    <!-- Dark or light before the first paint, so the app never flashes. -->
    <script>
      (function () {
        var saved = null
        try { saved = localStorage.getItem('workout-v2-theme') } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        document.querySelector('meta[name=theme-color]').content = dark ? '#0c0a09' : '#fafaf9'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
