name: Deploy Workout App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'WORKOUT-APP/**'
      - 'WORKOUT-APP-V2/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            WORKOUT-APP/package-lock.json
            WORKOUT-APP-V2/package-lock.json

      - name: Install dependencies (v1)
        run: npm ci
        working-directory: WORKOUT-APP

      - name: Build v1
        run: npm run build
        working-directory: WORKOUT-APP

      - name: Install dependencies (v2)
        run: npm ci
        working-directory: WORKOUT-APP-V2

      - name: Build v2
        run: npm run build
        working-directory: WORKOUT-APP-V2

      # v1 is served at the site root, v2 from the /v2/ subdirectory.
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r WORKOUT-APP/dist/. site/
          mkdir -p site/v2
          cp -r WORKOUT-APP-V2/dist/. site/v2/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
